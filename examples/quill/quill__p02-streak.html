<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quill — Streak</title>
<style>
  :root {
    --bg: #F6F2EA;
    --surface: #FFFFFF;
    --ink: #1B1916;
    --ink-2: #4A4742;
    --ink-dim: #8B867D;
    --hair: rgba(27, 25, 22, 0.07);
    --accent: #2D6A4F;
    --accent-soft: rgba(45, 106, 79, 0.10);
    --accent-strong: rgba(45, 106, 79, 0.85);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; -webkit-font-smoothing: antialiased; }
  .phone { max-width: 410px; min-height: 100vh; margin: 0 auto; padding: 22px 22px 110px; }

  .header { padding: 14px 0 24px; }
  .title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .subtitle { font-size: 13px; color: var(--ink-dim); margin-top: 2px; }

  .hero { background: var(--surface); border: 1px solid var(--hair); border-radius: 22px; padding: 26px; text-align: center; margin-bottom: 24px; }
  .flame { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-soft); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 14px; color: var(--accent); }
  .streak-big { font-size: 56px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; color: var(--ink); }
  .streak-unit { font-size: 13px; color: var(--ink-dim); margin-top: 6px; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 600; }
  .streak-note { font-size: 13px; color: var(--ink-2); margin-top: 14px; }

  .section-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); padding: 0 4px 12px; }

  .month-card { background: var(--surface); border: 1px solid var(--hair); border-radius: 18px; padding: 18px; margin-bottom: 16px; }
  .month-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .month-name { font-size: 14px; font-weight: 600; }
  .month-count { font-size: 12px; color: var(--ink-dim); }
  .weekrow { display: grid; grid-template-columns: 18px repeat(7, 1fr); gap: 6px; font-size: 9.5px; color: var(--ink-dim); letter-spacing: 0.06em; text-transform: uppercase; padding-bottom: 8px; }
  .weekrow span { text-align: center; }
  .grid { display: grid; grid-template-columns: 18px repeat(7, 1fr); gap: 6px; }
  .grid-label { font-size: 10px; color: var(--ink-dim); align-self: center; }
  .day { aspect-ratio: 1 / 1; border-radius: 5px; background: var(--hair); }
  .day.lvl1 { background: rgba(45,106,79,0.22); }
  .day.lvl2 { background: rgba(45,106,79,0.42); }
  .day.lvl3 { background: rgba(45,106,79,0.65); }
  .day.lvl4 { background: var(--accent); }
  .day.today { box-shadow: inset 0 0 0 1.5px var(--ink); }

  .stats-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--hair); border-radius: 14px; padding: 16px; }
  .stat-num { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
  .stat-label { font-size: 11.5px; color: var(--ink-dim); margin-top: 2px; }

  .legend { display: flex; align-items: center; gap: 6px; justify-content: flex-end; margin-top: 12px; font-size: 10.5px; color: var(--ink-dim); }
  .legend-box { width: 11px; height: 11px; border-radius: 3px; }

  .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 410px; display: flex; padding: 12px 22px 28px; background: rgba(246, 242, 234, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--hair); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink-dim); font-size: 10.5px; font-weight: 500; cursor: pointer; }
  .tab.active { color: var(--ink); }
  .tab svg { width: 20px; height: 20px; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="title">Your streak</div>
    <div class="subtitle">Keep the chain going.</div>
  </div>

  <div class="hero">
    <div class="flame">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2s4 5 4 9a4 4 0 0 1-8 0c0-1 .5-2 1-3 0 2 1 3 2 3 0-3 1-5 1-9z"/></svg>
    </div>
    <div class="streak-big">21</div>
    <div class="streak-unit">day streak</div>
    <div class="streak-note">Your best run yet · Don't break the chain</div>
  </div>

  <div class="section-title">Past 6 weeks</div>
  <div class="month-card">
    <div class="month-head">
      <span class="month-name">May 2026</span>
      <span class="month-count">23 of 31 active</span>
    </div>
    <div class="weekrow">
      <span></span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
    </div>
    <div class="grid">
      <div class="grid-label">W1</div>
      <div class="day lvl2"></div><div class="day lvl3"></div><div class="day lvl3"></div><div class="day lvl4"></div><div class="day lvl3"></div><div class="day lvl2"></div><div class="day"></div>
      <div class="grid-label">W2</div>
      <div class="day lvl3"></div><div class="day lvl4"></div><div class="day lvl4"></div><div class="day lvl3"></div><div class="day lvl4"></div><div class="day lvl3"></div><div class="day lvl2"></div>
      <div class="grid-label">W3</div>
      <div class="day lvl4"></div><div class="day lvl3"></div><div class="day lvl4"></div><div class="day lvl4"></div><div class="day lvl3"></div><div class="day lvl2"></div><div class="day"></div>
      <div class="grid-label">W4</div>
      <div class="day lvl3"></div><div class="day lvl4"></div><div class="day lvl4"></div><div class="day lvl4"></div><div class="day lvl4"></div><div class="day lvl3"></div><div class="day lvl3 today"></div>
      <div class="grid-label">W5</div>
      <div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div><div class="day"></div>
    </div>
    <div class="legend">
      Less
      <span class="legend-box" style="background:var(--hair)"></span>
      <span class="legend-box" style="background:rgba(45,106,79,0.22)"></span>
      <span class="legend-box" style="background:rgba(45,106,79,0.42)"></span>
      <span class="legend-box" style="background:rgba(45,106,79,0.65)"></span>
      <span class="legend-box" style="background:var(--accent)"></span>
      More
    </div>
  </div>

  <div class="stats-row">
    <div class="stat">
      <div class="stat-num">94<span style="font-size:14px;color:var(--ink-dim);font-weight:400">%</span></div>
      <div class="stat-label">May completion</div>
    </div>
    <div class="stat">
      <div class="stat-num">163</div>
      <div class="stat-label">Habits done</div>
    </div>
  </div>
</div>

<nav class="tabbar">
  <div class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    Today
  </div>
  <div class="tab active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    Streak
  </div>
  <div class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>
    Library
  </div>
  <div class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    Settings
  </div>
</nav>
</body>
</html>
