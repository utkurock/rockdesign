<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quill — Settings</title>
<style>
  :root {
    --bg: #F6F2EA;
    --surface: #FFFFFF;
    --ink: #1B1916;
    --ink-2: #4A4742;
    --ink-dim: #8B867D;
    --hair: rgba(27, 25, 22, 0.07);
    --hair-2: rgba(27, 25, 22, 0.14);
    --accent: #2D6A4F;
    --accent-soft: rgba(45, 106, 79, 0.10);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; -webkit-font-smoothing: antialiased; }
  .phone { max-width: 410px; min-height: 100vh; margin: 0 auto; padding: 22px 22px 110px; }

  .header { padding: 14px 0 24px; }
  .title { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; }
  .subtitle { font-size: 13px; color: var(--ink-dim); margin-top: 2px; }

  .profile { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--hair); border-radius: 18px; padding: 16px 18px; margin-bottom: 20px; }
  .avatar-lg { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 17px; }
  .profile-info { flex: 1; }
  .profile-name { font-size: 15px; font-weight: 600; }
  .profile-meta { font-size: 12.5px; color: var(--ink-dim); margin-top: 2px; }
  .profile-edit { font-size: 12.5px; color: var(--accent); font-weight: 600; }

  .section-title { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-dim); padding: 0 4px 12px; }
  .section { background: var(--surface); border: 1px solid var(--hair); border-radius: 18px; overflow: hidden; margin-bottom: 24px; }

  .row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--hair); }
  .row:last-child { border-bottom: 0; }
  .row-icon { width: 28px; height: 28px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .row-icon svg { width: 14px; height: 14px; }
  .row-label { flex: 1; font-size: 14px; }
  .row-value { font-size: 13px; color: var(--ink-dim); }

  .toggle { width: 38px; height: 22px; border-radius: 999px; background: var(--hair-2); position: relative; transition: background 160ms ease; cursor: pointer; flex-shrink: 0; }
  .toggle::after { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform 160ms ease; box-shadow: 0 1px 2px rgba(0,0,0,0.10); }
  .toggle.on { background: var(--accent); }
  .toggle.on::after { transform: translateX(16px); }

  .stepper { display: flex; align-items: center; gap: 12px; }
  .step-btn { width: 26px; height: 26px; border-radius: 50%; background: var(--hair); border: 0; display: flex; align-items: center; justify-content: center; color: var(--ink-2); cursor: pointer; font-size: 16px; font-weight: 500; }
  .step-val { font-size: 14px; font-weight: 600; min-width: 40px; text-align: center; }

  .chevron { color: var(--ink-dim); }
  .danger { color: #B91C1C; }

  .tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 410px; display: flex; padding: 12px 22px 28px; background: rgba(246, 242, 234, 0.92); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-top: 1px solid var(--hair); }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--ink-dim); font-size: 10.5px; font-weight: 500; cursor: pointer; }
  .tab.active { color: var(--ink); }
  .tab svg { width: 20px; height: 20px; }
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <div class="title">Settings</div>
    <div class="subtitle">Daily goal, reminders, account.</div>
  </div>

  <div class="profile">
    <div class="avatar-lg">S</div>
    <div class="profile-info">
      <div class="profile-name">Sam Whitaker</div>
      <div class="profile-meta">Free plan · joined Mar 2026</div>
    </div>
    <div class="profile-edit">Edit</div>
  </div>

  <div class="section-title">Daily goal</div>
  <div class="section">
    <div class="row">
      <div class="row-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l5 5L21 4"/></svg>
      </div>
      <div class="row-label">Habits per day</div>
      <div class="stepper">
        <button class="step-btn">−</button>
        <span class="step-val">5</span>
        <button class="step-btn">+</button>
      </div>
    </div>
    <div class="row">
      <div class="row-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      </div>
      <div class="row-label">Reset time</div>
      <div class="row-value">4:00 AM</div>
    </div>
    <div class="row">
      <div class="row-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/></svg>
      </div>
      <div class="row-label">Allow rest days</div>
      <div class="toggle on"></div>
    </div>
  </div>

  <div class="section-title">Notifications</div>
  <div class="section">
    <div class="row">
      <div class="row-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21h4"/></svg>
      </div>
      <div class="row-label">Morning reminder</div>
      <div class="row-value">8:30 AM</div>
    </div>
    <div class="row">
      <div class="row-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </div>
      <div class="row-label">Evening check-in</div>
      <div class="toggle on"></div>
    </div>
    <div class="row">
      <div class="row-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2s4 5 4 9a4 4 0 0 1-8 0c0-1 .5-2 1-3 0 2 1 3 2 3 0-3 1-5 1-9z"/></svg>
      </div>
      <div class="row-label">Streak alerts</div>
      <div class="toggle on"></div>
    </div>
  </div>

  <div class="section-title">Account</div>
  <div class="section">
    <div class="row">
      <div class="row-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 17l5-5-5-5M21 12H9M13 4H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6"/></svg>
      </div>
      <div class="row-label">Export data</div>
      <span class="chevron">›</span>
    </div>
    <div class="row">
      <div class="row-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><path d="M21 12c0 5-9 9-9 9s-9-4-9-9V5l9-3 9 3z"/></svg>
      </div>
      <div class="row-label">Privacy</div>
      <span class="chevron">›</span>
    </div>
    <div class="row">
      <div class="row-icon" style="background:rgba(185,28,28,0.10);color:#B91C1C">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 17l5-5-5-5M21 12H9M13 4H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h6"/></svg>
      </div>
      <div class="row-label danger">Sign out</div>
      <span class="chevron">›</span>
    </div>
  </div>
</div>

<nav class="tabbar">
  <div class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    Today
  </div>
  <div class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
    Streak
  </div>
  <div class="tab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg>
    Library
  </div>
  <div class="tab active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    Settings
  </div>
</nav>
</body>
</html>
